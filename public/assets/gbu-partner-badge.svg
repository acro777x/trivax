<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Rounded subtle container -->
  <rect width="240" height="60" rx="30" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
  
  <!-- GBU Stupa / Lotus Emblem Icon -->
  <g transform="translate(16, 12)">
    <circle cx="18" cy="18" r="16" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1.5"/>
    <!-- Stupa Arch -->
    <path d="M18 6 C13 6 10 11 10 18 L26 18 C26 11 23 6 18 6 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Base plinth -->
    <rect x="8" y="20" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="6" y="25" width="24" height="2" rx="1" fill="#ffffff" opacity="0.7"/>
    <!-- Finial spire -->
    <line x1="18" y1="3" x2="18" y2="6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="2.5" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="60" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    GAUTAM BUDDHA
  </text>
  <text x="60" y="42" fill="rgba(255, 255, 255, 0.75)" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" letter-spacing="0.5">
    UNIVERSITY • GBU.AC.IN
  </text>
</svg>
